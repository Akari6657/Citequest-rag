<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CiteQuest-RAG — Academic Search + AI Overview</title>

  <!-- Pico.css — semantic CSS foundation -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">

  <!-- Custom styles -->
  <link rel="stylesheet" href="/css/style.css">

  <!-- Alpine.js — reactive components -->
  <script defer
          src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js">
  </script>

  <!-- App scripts -->
  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
</head>
<body>
  <div class="app-container"
       x-data="citequest"
       x-cloak>

    <!-- ==================================================================
         Header
         ================================================================== -->

    <header class="app-header">
      <h1>CiteQuest-RAG<span class="version"> Academic Search + AI Overview</span></h1>
    </header>

    <!-- ==================================================================
         Search bar
         ================================================================== -->

    <div class="search-row">
      <input type="search"
             x-model="query"
             @keydown.enter="doSearch"
             placeholder="输入关键词或问题，如: What are multimodal LLMs?"
             autofocus>
      <button @click="doSearch"
              :disabled="loading || !query.trim()">
        <span x-show="!loading">搜索</span>
        <span x-show="loading" aria-busy="true">搜索中...</span>
      </button>
    </div>

    <!-- ==================================================================
         Controls: mode switcher, alpha slider, AI Overview toggle
         ================================================================== -->

    <div class="controls">

      <!-- Mode switcher (pill-style radio group) -->
      <div class="mode-switcher">
        <input type="radio" name="mode" value="hybrid" id="m-hybrid"
               x-model="mode">
        <label for="m-hybrid">Hybrid</label>

        <input type="radio" name="mode" value="lexical" id="m-lexical"
               x-model="mode">
        <label for="m-lexical">Lexical</label>

        <input type="radio" name="mode" value="vector" id="m-vector"
               x-model="mode">
        <label for="m-vector">Vector</label>
      </div>

      <!-- Alpha slider (only shown in hybrid mode) -->
      <div class="alpha-group"
           x-show="mode === 'hybrid'"
           x-transition>
        <label for="alpha-slider">&alpha;:</label>
        <input type="range" id="alpha-slider"
               x-model="alpha"
               min="0" max="1" step="0.05">
        <span x-text="Number(alpha).toFixed(2)">0.50</span>
      </div>

      <!-- Inclusive publication-year filter -->
      <div class="year-filter" role="group" aria-label="发表年份">
        <span>年份</span>
        <input type="number"
               x-model="yearFrom"
               placeholder="起始"
               step="1"
               aria-label="起始年份">
        <span>至</span>
        <input type="number"
               x-model="yearTo"
               placeholder="结束"
               step="1"
               aria-label="结束年份">
      </div>

      <!-- AI Overview toggle -->
      <label class="toggle-row">
        <input type="checkbox" x-model="includeOverview">
        <span>AI Overview</span>
      </label>
    </div>

    <!-- ==================================================================
         AI Overview — loading state
         ================================================================== -->

    <section class="overview overview-loading" x-show="overviewLoading" x-transition>
      <div class="loading-header">
        <span class="loading-spinner"></span>
        <span>AI Overview</span>
      </div>
      <div class="loading-phase" x-text="overviewMessage"></div>
    </section>

    <!-- ==================================================================
         AI Overview — result
         ================================================================== -->

    <section class="overview" x-show="overview && !overviewLoading" x-transition>
      <h3>
        AI Overview
        <small x-text="'· ' + formatLatency(overview?.latency_ms)"></small>
      </h3>
      <div class="answer" x-text="overview?.answer"></div>

      <!-- Citation warnings -->
      <template x-for="w in overview?.citation_warnings || []">
        <span class="warning-tag" x-text="'⚠ ' + w"></span>
      </template>

      <!-- Citation list (collapsible) -->
      <div class="citation-section" x-show="overview?.citations?.length">
        <button class="citation-toggle"
                @click="showCitations = !showCitations"
                :aria-expanded="showCitations">
          <span class="citation-arrow" :class="{ 'is-open': showCitations }">▸</span>
          📚 引用来源
          <span class="citation-count" x-text="'(' + (overview?.citations?.length || 0) + ')'"></span>
        </button>

        <ol class="citation-list" x-show="showCitations" x-transition>
          <template x-for="c in overview?.citations || []" :key="c.citation_id">
            <li class="citation-item">
              <span class="citation-id" x-text="'[' + c.citation_id + ']'"></span>
              <span class="citation-title" x-text="c.title"></span>
              <a x-show="c.url" :href="c.url" target="_blank"
                 rel="noopener" class="citation-link">原文</a>
            </li>
          </template>
        </ol>
      </div>
    </section>

    <!-- ==================================================================
         Results area
         ================================================================== -->

    <!-- Loading state -->
    <div class="loading-state" x-show="loading">
      <span class="spinner"></span>
      <span x-text="loadingMessage">正在搜索...</span>
    </div>

    <!-- Error state -->
    <div class="empty-state" x-show="error && !loading">
      <p x-text="'请求失败: ' + error"></p>
    </div>

    <!-- Empty / initial state -->
    <div class="empty-state" x-show="!loading && !error && results.length === 0">
      <p>输入关键词开始搜索</p>
    </div>

    <!-- Results (shown when we have data) -->
    <template x-if="!loading && results.length > 0">
      <div>
        <div class="results-header"
             x-text="totalResults + ' 条结果 · ' + formatLatency(elapsed * 1000) + ' · mode=' + mode">
        </div>

        <template x-for="(r, idx) in results" :key="r.chunk_id || idx">
          <article class="result-card">

            <div class="result-body">
              <div class="r-title" x-html="highlightTitle(r.title, query)"></div>
              <div class="r-meta">
                <span x-text="(r.year || '?') + ' · ' + (r.venue || 'arXiv')"></span>
                <template x-if="r.authors?.length">
                  <span x-text="' · ' + r.authors.slice(0, 3).join(', ')"></span>
                </template>
              </div>
              <div class="r-snippet"
                   x-show="r.snippet"
                   x-text="r.snippet">
              </div>
            </div>
          </article>
        </template>
      </div>
    </template>

  </div><!-- /.app-container -->

  <!-- ==================================================================
       Alpine.js component definition
       ================================================================== -->

  <script>
  document.addEventListener("alpine:init", () => {
    Alpine.data("citequest", () => ({
      // ---- state ----
      query: "",
      mode: "hybrid",
      alpha: 0.5,
      yearFrom: "",
      yearTo: "",
      includeOverview: true,
      loading: false,
      loadingMessage: "正在搜索...",
      error: null,
      results: [],
      overview: null,
      totalResults: 0,
      elapsed: 0,

      // Citation toggle
      showCitations: true,

      // Async AI Overview loading (SSE-driven)
      overviewLoading: false,
      overviewMessage: "",

      // ---- methods ----
      async doSearch() {
        const q = this.query.trim();
        if (!q) return;

        const yearFrom = this.yearFrom === "" ? null : Number(this.yearFrom);
        const yearTo = this.yearTo === "" ? null : Number(this.yearTo);
        if (
          (yearFrom !== null && !Number.isInteger(yearFrom))
          || (yearTo !== null && !Number.isInteger(yearTo))
          || (yearFrom !== null && yearTo !== null && yearFrom > yearTo)
        ) {
          this.error = "年份范围无效：起始年份不能晚于结束年份";
          this.results = [];
          this.overview = null;
          this.totalResults = 0;
          return;
        }

        // Clear previous state
        this.loading = true;
        const mayRewrite = /[一-鿿]/.test(q)
          && (this.mode === "lexical" || (this.mode === "hybrid" && Number(this.alpha) > 0));
        this.loadingMessage = mayRewrite
          ? "🔍 检测到中文查询，正在改写为英文关键词以提升召回..."
          : "正在搜索...";
        this.error = null;
        this.results = [];
        this.overview = null;
        this.overviewLoading = false;
        this.totalResults = 0;
        this.elapsed = 0;
        if (this._abortStream) { this._abortStream.abort(); this._abortStream = null; }

        const start = performance.now();
        const wantOverview = this.includeOverview;
        const mode = this.mode;
        const alpha = Number(this.alpha);
        let shouldRag = false;

        // ---- Phase 1: Search (always, fast) ----
        try {
          const data = await searchPapers({
            query: q,
            mode: mode,
            alpha: alpha,
            include_overview: false,  // don't wait for LLM
            top_k: 10,
            year_from: yearFrom,
            year_to: yearTo,
          });

          this.results = data.results || [];
          this.totalResults = data.total_results || this.results.length;
          shouldRag = data.should_rag || false;
        } catch (e) {
          this.error = e.message;
          this.loading = false;
          return;
        }

        this.elapsed = (performance.now() - start) / 1000;
        this.loading = false;  // results are ready — show them immediately

        // ---- Phase 2: AI Overview (async SSE, only if toggle on + router says yes) ----
        if (!wantOverview) return;
        if (!shouldRag) return;  // router decided against RAG (e.g. short keywords)

        this.overviewLoading = true;
        this.overviewMessage = "正在检索相关论文...";

        const overviewStart = performance.now();

        this._abortStream = askQuestionStream({
          body: {
            question: q,
            retrieval_mode: mode,
            alpha: alpha,
            top_k: 8,
            pre_retrieved: this.results.slice(0, 8),  // reuse Phase 1 results
          },
          onEvent: (type, data) => {
            if (type === "status") {
              this.overviewMessage = data.message || this.overviewMessage;
            } else if (type === "result") {
              data.latency_ms = Math.round(performance.now() - overviewStart);
              this.overview = data;
            }
          },
          onDone: () => {
            this.overviewLoading = false;
            this._abortStream = null;
          },
          onError: (err) => {
            console.warn("AI Overview stream failed:", err);
            this.overviewLoading = false;
            this._abortStream = null;
          },
        });
      },
    }));
  });
  </script>
</body>
</html>
